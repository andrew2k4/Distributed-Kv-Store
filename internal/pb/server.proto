syntax="proto3";

package server;

option go_package = "distributed_kv_store/internal/pb";

service KvStore {
    rpc SetHandler(SetRequest) returns (SetResponse);
    rpc GetHandler(GetRequest) returns (GetResponse);
    rpc DeleteHandler(DeleteRequest) returns (DeleteResponse); 
    rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
    rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
}

message SetRequest {
    string key = 1;
    string value = 2;
}

message GetRequest {
    string key = 1;
}

message  DeleteRequest {
    string key = 1;
}

message SetResponse {
    bool success = 1;
}

message GetResponse {
    bool found = 1;
    string value = 2;
}

message DeleteResponse {
    bool success = 1;
}

message LogEntry {
    int64  term  = 1;
    int64  index = 2;
    string op    = 3; // "SET" or "DEL"
    string key   = 4;
    string value = 5;
}

message AppendEntriesRequest {
    int64             term           = 1;
    string            leader_id      = 2;
    int64             prev_log_index = 3;
    int64             prev_log_term  = 4;
    repeated LogEntry entries        = 5;
    int64             leader_commit  = 6;
}

message AppendEntriesResponse {
    int64 term    = 1;
    bool  success = 2;
    int64 conflict_index = 3;
    int64 conflict_term  = 4;
}

message RequestVoteRequest {
    int64  term           = 1;
    string candidate_id   = 2;
    int64  last_log_index = 3;
    int64  last_log_term  = 4;
}

message RequestVoteResponse {
    int64 term         = 1;
    bool  vote_granted = 2;
}